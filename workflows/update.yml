name: Update TV Passport EPG

on:
  schedule:
    # 00:17 UTC = 20:17 EDT / 19:17 EST
    # 12:17 UTC = 08:17 EDT / 07:17 EST
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvpassport-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update EPG
        shell: bash
        run: |
          chmod +x scripts/update_epg.sh
          ./scripts/update_epg.sh

      - name: Commit updated EPG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/tvpassport.xml

          if git diff --cached --quiet; then
            echo "EPG has not changed."
            exit 0
          fi

          git commit -m "Update TV Passport EPG"
          git push
