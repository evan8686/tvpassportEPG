name: Grab Custom M3U Subscriptions

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-m3u:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grab Yan-G M3U
        run: |
          echo "开始下载 Yan-G M3U..."

          curl -fLsS -L \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o yanG.m3u \
            "https://iptv.yang-1989.xyz/playlist.m3u"

          if ! head -c 100 yanG.m3u | grep -q '#EXTM3U'; then
            echo "错误：Yan-G 下载结果不是有效的 M3U 文件"
            exit 1
          fi

          echo "Yan-G M3U 下载成功"

      - name: Grab GPT M3U
        run: |
          URL="https://good.852851.xyz/sub/rvk5DMk5AD0B/playlist.m3u"

          echo "开始下载 GPT M3U..."

          curl -sS -L \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -A "VLC/3.0.21 LibVLC/3.0.21" \
            -H "Accept: audio/x-mpegurl, audio/*, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -D gpt-headers.txt \
            -o GPT.m3u \
            -w '\nHTTP 状态码: %{http_code}\n最终 URL: %{url_effective}\n下载大小: %{size_download} bytes\n' \
            "$URL" || true

          echo "===== GPT 响应头 ====="
          cat gpt-headers.txt

          if [ ! -s GPT.m3u ] || ! head -c 100 GPT.m3u | grep -q '#EXTM3U'; then
            echo "错误：GPT 下载失败或返回内容不是有效的 M3U 文件"
            echo "文件开头："
            head -c 500 GPT.m3u || true
            echo
            exit 1
          fi

          echo "GPT M3U 下载成功"

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -f yanG.m3u GPT.m3u

          if git diff --cached --quiet; then
            echo "订阅文件没有变化，无需提交"
          else
            git commit -m "Auto update Yan-G and GPT M3U"
            git push
            echo "所有 M3U 文件提交完成！"
          fi
