name: Grab Custom M3U Subscriptions

on:
  schedule:
    # UTC 0, 6, 12, 18 点，对应北京时间 8, 14, 20, 2 点
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grab Yan-G M3U
        run: |
          echo "开始下载 Yan-G M3U..."
          curl -fLsS -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o yanG.m3u \
            "https://iptv.yang-1989.xyz/playlist.m3u"

      - name: Grab GPT M3U
        run: |
          echo "开始下载 GPT M3U..."

          curl -sS -L --compressed \
            -A "OTT Navigator/1.7.0" \
            -H "Accept: */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -D gpt-headers.txt \
            -o GPT.m3u \
            -w "\nHTTP 状态码: %{http_code}\n最终 URL: %{url_effective}\n" \
            "https://good.852851.xyz/sub/rvk5DMk5AD0B/playlist.m3u"

          echo "响应头中的 Cloudflare 信息："
          grep -iE '^(HTTP/|cf-ray:|cf-mitigated:|content-type:|location:)' gpt-headers.txt || true

          echo "返回内容前 5 行："
          head -n 5 GPT.m3u

          if grep -qiE 'Attention Required!|Sorry, you have been blocked|cf-error-details' GPT.m3u; then
            echo "::error::GPT 订阅仍然返回 Cloudflare 拦截页面"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [ -s yanG.m3u ] || [ -s GPT.m3u ]; then
            echo "下载步骤完成，检查文件变动..."

            git add -f yanG.m3u GPT.m3u

            if ! git diff --cached --quiet; then
              git commit -m "Auto update Yan-G and GPT M3U"
              git push
            else
              echo "文件没有变化，无需提交。"
            fi

            echo "处理完成！"
          else
            echo "错误：两个 M3U 文件均不存在或为空！"
            exit 1
          fi
