name: Grab TV Passport EPG
on:
  schedule:
    # 每天 UTC 时间 0 点运行 (美东时间前一天晚上 8 点)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击运行

permissions:
  contents: write # 允许 Action 将抓取到的文件推送回仓库

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Install dependencies
        run: npm install
        working-directory: ./epg

      - name: Grab EPG (限制并发防封IP)
        # 读取上一层目录的 tvpassport.channels.xml，输出 epg.xml，最大并发限制为2
        run: npm run grab -- --channels=../tvpassport.channels.xml --output=../epg.xml --maxConnections=2 --days=3
        working-directory: ./epg

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff-index --quiet HEAD || git commit -m "Auto update EPG"
          git push
