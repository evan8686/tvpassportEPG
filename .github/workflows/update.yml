name: Grab TV Passport EPG

on:
  schedule:
    # 每天 UTC 时间 0 点运行 (美东时间前一天晚上 8 点)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

permissions:
  contents: write # 允许 Action 将抓取到的文件推送回仓库

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Install dependencies
        run: npm install
        working-directory: ./epg

      - name: Grab EPG (限制并发防封IP)
        # 即使抓取失败，也不要让这一步直接中断 Action，允许进入下一步进行判断
        continue-on-error: true 
        run: npm run grab -- --channels=../tvpassport.channels.xml --output=../epg.xml --maxConnections=2 --days=3
        working-directory: ./epg

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 判断当前目录下是否成功生成了 epg.xml 文件
          if [ -f epg.xml ]; then
            echo "抓取成功，正在提交 epg.xml..."
            git add epg.xml
            # 检测是否有文件变动，有变动才提交，防止重复提交
            git diff-index --quiet HEAD || git commit -m "Auto update EPG"
            git push
            echo "提交完成！"
          else
            echo "⚠️ 警告: epg.xml 未生成！"
            echo "原因可能是：1. tvpassport.channels.xml 文件名错误或不存在；2. GitHub IP 被 TV Passport (Cloudflare) 封禁返回 403。"
            echo "请展开上一步 [Grab EPG] 的日志查看具体报错信息。"
            exit 1
          fi
